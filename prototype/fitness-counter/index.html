              <button type="button" class="workout-end" data-role="end-trigger" data-action="OPEN_END_SHEET" aria-label="结束训练">结束</button>
            </span>
          </header>

          <h2 class="screen__title" id="workout-title" tabindex="-1">${state.exercises.length} 个动作</h2>

          ${renderRhythmTrack(stats, 'linear')}

          <div class="workout-groups">
            ${state.exercises.map((item, index) => renderWorkoutExercise(item, index)).join('')}
          </div>

          <div class="actions workout-secondary">
            <button type="button" class="button button--ghost" data-action="EDIT_CURRENT" ${editable ? '' : 'disabled'}>修改数据</button>
            <button type="button" class="button button--ghost" data-action="SKIP_SET" ${editable ? '' : 'disabled'}>跳过本组</button>
            <button type="button" class="button button--ghost" data-action="ADD_SET" ${exercise ? `data-exercise-id="${exercise.id}"` : 'disabled'}>添加组</button>
          </div>

          ${editingSetId && selected && editable ? renderSetEditor(selected, Math.max(0, selectedIndex)) : ''}
        </div>
        <div class="workout-footer">${mainAction}</div>
      </section>
    `;
  }

  // 总结正文：总结页与今日完成卡的只读展开共用同一份统计口径，
  // review=true 时不渲染可编辑备注，也不重复展示总时长引导卡。
  function renderSummaryBody(review) {
    const summary = state.completedSummary || {};
    const completed = summary.completed || 0;
    const skipped = summary.skipped || 0;
    const unfinished = (summary.pending || 0) + (summary.active || 0);
    const exerciseItems = state.exercises.map(exercise => {
      const done = exercise.sets.filter(set => set.status === 'completed').length;
      const skippedSets = exercise.sets.filter(set => set.status === 'skipped').length;
      return `
        <li class="summary-item">
          <span class="summary-item__name">${escapeHtml(exercise.name)}</span>
          <span class="summary-item__meta">完成 ${done} / ${exercise.sets.length} 组${skippedSets ? ` · 跳过 ${skippedSets}` : ''}</span>
        </li>
      `;
    }).join('');

    // 备注是用户可控文本：core 存原文，渲染时一律转义，既保证只读展示安全，
    // 也避免 `</textarea>` 提前闭合破坏后续 DOM。
    const noteText = state.notes ? state.notes : '本次没有留下备注';

    const notes = review
      ? `<div class="summary-notes">
          <div class="summary-notes__head"><span class="summary-notes__label">训练备注</span></div>
          <p class="summary-item__meta" data-role="notes-readonly">${escapeHtml(noteText)}</p>
        </div>`
      : `<div class="summary-notes">
          <div class="summary-notes__head">
            <label class="summary-notes__label" for="summary-notes">训练备注</label>
            <span class="summary-notes__count" data-role="notes-count">${state.notes.length} / 300</span>
          </div>
          <textarea class="summary-notes__input" id="summary-notes" data-role="notes" maxlength="300"
            placeholder="记录本次训练的感受或调整（可选）">${escapeHtml(state.notes)}</textarea>
        </div>`;

    const lead = review ? '' : `
      <div class="summary-lead">
        <span class="summary-lead__eyebrow">${escapeHtml(WORKOUT_PLAN.source)}</span>
        <span class="summary-lead__value" data-role="summary-duration">${Core.formatDuration(summary.workoutSeconds || 0)}</span>
        <span class="summary-lead__meta">总时长 · 完成 ${summary.completedExercises || 0} 个动作</span>
      </div>
    `;

    return `
      ${lead}
      <section class="stats summary-stats" aria-label="本次训练统计">
        <div class="stat"><span class="stat__value">${completed}</span><span class="stat__label">完成组</span></div>
        <div class="stat"><span class="stat__value">${skipped}</span><span class="stat__label">跳过组</span></div>
        <div class="stat"><span class="stat__value">${unfinished}</span><span class="stat__label">未完成组</span></div>
      </section>
      ${renderRhythmTrack(Core.getWorkoutStats(state), 'closing')}
      <section class="section">
        <div class="section__head"><h3 class="section__title">动作摘要</h3><span class="section__meta">${state.exercises.length} 个动作</span></div>
        <ul class="summary-list">${exerciseItems}</ul>
      </section>
      ${notes}
    `;
  }

  function renderSummary() {
    return `
      <section class="screen" data-screen="summary" aria-labelledby="summary-title">
        <div class="screen__scroll">
          <header class="prepare-top"><span class="page-tag">总结</span></header>
          <h2 class="screen__title" id="summary-title" tabindex="-1">本次训练总结</h2>
          ${renderSummaryBody(false)}
        </div>
        <div class="summary-footer">
          <button type="button" class="button button--primary" data-action="COMPLETE_SESSION">完成</button>
        </div>
      </section>
    `;
  }

  // 结束 Bottom Sheet：训练页与休息页共用同一入口，背景保持当前训练/休息上下文可见。
  function renderEndSheet() {
    const stats = Core.getWorkoutStats(state);
    const timers = Core.deriveTimers(state, Date.now());
    const remaining = stats.pending + stats.active;
    const canSave = Core.canSaveWorkout(state);
    return `
      <div class="overlay-layer${uiState.discardDialogOpen ? ' overlay-layer--dialog' : ''}" data-role="overlay-layer">
        <div class="overlay-mask" data-action="${uiState.discardDialogOpen ? 'CLOSE_DISCARD_CONFIRM' : 'CLOSE_END_SHEET'}" aria-hidden="true"></div>
        <div class="end-sheet" id="end-sheet" role="dialog" aria-modal="true" aria-labelledby="end-sheet-title">
          <div class="end-sheet__head">
            <h2 class="end-sheet__title" id="end-sheet-title" tabindex="-1">结束本次训练？</h2>
            <p class="end-sheet__hint">${canSave ? '保存后进入训练总结，其余未完成组将标为跳过。' : '还没有完成任何一组。'}</p>
          </div>
          <div class="sheet-metrics">
            <div class="sheet-metric"><span class="sheet-metric__value">${Core.formatDuration(timers.workoutSeconds)}</span><span class="sheet-metric__label">总训练时长</span></div>
            <div class="sheet-metric"><span class="sheet-metric__value">${stats.completedExercises}</span><span class="sheet-metric__label">完成动作</span></div>
            <div class="sheet-metric"><span class="sheet-metric__value">${stats.completed}</span><span class="sheet-metric__label">已完成组</span></div>
            <div class="sheet-metric"><span class="sheet-metric__value">${remaining}</span><span class="sheet-metric__label">剩余组</span></div>
          </div>
          ${canSave ? '' : '<p class="end-sheet__hint" data-role="save-hint">至少完成一组后才能保存训练</p>'}
          <div class="sheet-actions">
            <button type="button" class="button button--primary" data-action="SAVE_PARTIAL" ${canSave ? '' : 'disabled'}>保存并结束训练</button>
            <button type="button" class="button button--ghost" data-action="CLOSE_END_SHEET">返回继续训练</button>
            <button type="button" class="button button--ghost" data-action="OPEN_DISCARD_CONFIRM">放弃本次训练</button>
          </div>
        </div>
        ${uiState.discardDialogOpen ? renderDiscardDialog() : ''}
      </div>
    `;
  }

  // 放弃二次确认：默认焦点落在安全的「返回训练」，确认放弃才真正丢弃数据。
  function renderDiscardDialog() {
    return `
      <div class="discard-dialog" id="discard-dialog" role="alertdialog" aria-modal="true"
        aria-labelledby="discard-dialog-title" aria-describedby="discard-dialog-desc">
        <h2 class="discard-dialog__title" id="discard-dialog-title">放弃本次训练？</h2>
        <p class="discard-dialog__desc" id="discard-dialog-desc">已完成的组、计时与备注都会丢失，且无法恢复。</p>
        <div class="discard-dialog__actions">
          <button type="button" class="button button--primary" data-role="discard-cancel" data-action="CLOSE_DISCARD_CONFIRM">返回训练</button>
          <button type="button" class="button button--ghost" data-action="CONFIRM_DISCARD">确认放弃</button>
        </div>
      </div>
    `;
  }

  // rest / summary 已由专门渲染接管，这里只承接未知 screen 的安全占位。
  function renderPlaceholder() {
    const labels = { workout: '训练', rest: '休息', summary: '小结' };
    const label = labels[state.screen] || '训练';
    return `
      <section class="screen" data-screen="${state.screen}" aria-labelledby="placeholder-title">
        <div class="screen__scroll">
          <header class="prepare-top">
            <span class="page-tag">${label}</span>
          </header>
          <h2 class="screen__title" id="placeholder-title" tabindex="-1">${label}页</h2>
          <p class="placeholder-note">该页面将在后续任务实现，当前仅完成状态切换。</p>
        </div>
      </section>
    `;
  }

  function screenMarkup() {
    let markup;
    if (state.screen === 'today') markup = renderToday();
    else if (state.screen === 'prepare') markup = renderPrepare();
    else if (state.screen === 'workout') markup = renderWorkout();
    else if (state.screen === 'rest') markup = renderRest();
    else if (state.screen === 'summary') markup = renderSummary();
    else markup = renderPlaceholder();
    // 主题菜单在此全局渲染一次，所有屏幕共享同一 #theme-menu，避免各屏各自复制导致 id 冲突。
    return markup + renderThemeMenu() + (uiState.endSheetOpen ? renderEndSheet() : '');
  }

  // render() 会用 innerHTML 重建 #screen-root，被点击的元素连同焦点一起销毁，
  // 因此需要重建后再显式迁移焦点。
  function applyPendingFocus() {
    if (!pendingFocus) return;
    const target = document.querySelector(FOCUS_TARGETS[pendingFocus] || pendingFocus);
    pendingFocus = null;
    if (target) target.focus();
  }

  // 数字输入是系统边界：空值/非有限值只留在界面上，不写入状态。
  // 这里读出编辑值并做统一校验，返回 null 表示「本次不提交」。
  function sanitizeEditValue(raw) {
    if (raw === null || raw === undefined) return null;
    const text = String(raw).trim();
    if (text === '') return null;
    const value = Number(text);
    return Number.isFinite(value) ? value : null;
  }

  function readSetEdit(input) {
    const setId = input.getAttribute('data-set-id');
    const field = input.getAttribute('data-field');
    if (field !== 'weight' && field !== 'reps') return null;
    const raw = input.value.trim();
    if (raw === '') {
      // 空值提交：从当前 state 回写实际值，保持所见即所用，避免 UI/state 分叉。
      const set = currentSet(setId);
      if (set) input.value = String(field === 'weight' ? set.actualWeight : set.actualReps);
      return null;
    }
    const value = Number(raw);
    if (!Number.isFinite(value)) return null;
    return { setId, patch: field === 'weight' ? { actualWeight: value } : { actualReps: value } };
  }

  function syncSetEditDom(setId) {
    const set = currentSet(setId);
    if (!set) return;
    screenRoot.querySelectorAll(`[data-set-row="${setId}"] .prep-set__flag`).forEach(flag => { flag.hidden = !set.temporary; });
    const temp = screenRoot.querySelector(`[data-set-row="${setId}"] [data-role="temp-flag"]`);
    if (temp) temp.hidden = !set.temporary;
    const actual = screenRoot.querySelector(`[data-set-row="${setId}"] [data-role="actual"]`);
    if (actual) actual.textContent = `实际 ${set.actualWeight} kg × ${set.actualReps}`;
  }

  // 统一的编辑落库路径：只有非空且 Number.isFinite 的值才会进入 core。
  function applySetEdit(setId, patch) {
    state = Core.editSet(state, setId, patch);
    // 局部同步，避免整页重建打断连续编辑与 Tab 顺序。
    syncSetEditDom(setId);
    announce('已记录本次调整，仅本次生效');
  }

  function commitSetEdit(input) {
    const edit = readSetEdit(input);
    if (!edit) return;
    applySetEdit(edit.setId, edit.patch);
  }

  function render() {
    document.documentElement.setAttribute('data-theme', state.theme);
    shell.setAttribute('data-theme', state.theme);
    renderThemeSwitcher();
    // 桌面演示栏的「跳至目标前 3 秒」只在休息状态出现（≤520px 时整个演示栏隐藏）。
    jumpRestButton.hidden = state.screen !== 'rest';
    screenRoot.innerHTML = screenMarkup();
    // 覆盖层打开时把背景屏设为 inert：视觉仍可辨，但不能被误操作或被读屏当成活动内容。
    // 覆盖层与背景屏是兄弟节点，inert 只加在背景屏上，随每次重建重新计算，不会永久残留。
    if (uiState.endSheetOpen) {
      const background = screenRoot.querySelector('.screen');
      if (background) background.inert = true;
      // 二次确认打开时，被盖在下面的结束 Sheet 也必须 inert：遮罩虽已抬到 Sheet 之上，
      // 但这里再禁一次，确保鼠标、键盘与辅助技术都无法越过弹窗触发底层的保存/关闭。
      if (uiState.discardDialogOpen) {
        const sheet = screenRoot.querySelector('#end-sheet');
        if (sheet) sheet.inert = true;
      }
    }
    applyPendingFocus();
  }

  // 离开/重置休息时清除一次性界面标志，避免下一轮休息复播或残留面板与覆盖层。
  function resetRestUi() {
    choosingNext = false;
    restTargetAnnounced = false;
    uiState.endSheetOpen = false;
    uiState.discardDialogOpen = false;
  }

  // 记录是哪个「结束」入口打开了 Sheet：关闭后焦点回到同一个入口。
  function endTriggerSelector(element) {
    return element && element.getAttribute('data-role') === 'main-action'
      ? '[data-role="main-action"]'
      : '[data-role="end-trigger"]';
  }

  function dispatch(action) {
    if (!action || typeof action.type !== 'string') return;
    if (action.type === 'SET_THEME') {
      const fromMenu = action.fromMenu === undefined ? themeMenuOpen : action.fromMenu;
      state = Core.setTheme(state, action.theme);
      storeTheme(state.theme);
      themeMenuOpen = false;
      // 弹层来源回到触发按钮；桌面演示栏来源回到对应主题按钮，避免重渲染后焦点丢失。
      pendingFocus = fromMenu ? 'theme-trigger' : `#theme-switcher [data-theme-choice="${state.theme}"]`;
      announce(`已切换到${THEME_LABELS[state.theme]}`);
    } else if (action.type === 'OPEN_PREPARE') {
      // 完成归档后今日仍保留「开始今日训练」入口；再次开始视为新一轮，
      // 必须从干净的组状态出发，否则会带着上一轮的 completed/skipped 进入准备页。
      if (state.sessionStatus === 'completed') {
        state = { ...Core.createInitialState(Date.now()), theme: state.theme };
        uiState.completedSummaryOpen = false;
      }
      state = Core.prepareWorkout(state);
      themeMenuOpen = false;
      pendingFocus = '#prepare-title';
      announce('准备开始今日训练，可先确认本次安排');
    } else if (action.type === 'BACK_TODAY') {
      state = { ...state, screen: 'today', sessionStatus: 'idle' };
      resetRestUi();
      pendingFocus = '#today-title';
      announce('已返回今日');
    } else if (action.type === 'TOGGLE_EXERCISE') {
      state = Core.toggleExercise(state, action.exerciseId);
      pendingFocus = `[data-action="TOGGLE_EXERCISE"][data-exercise-id="${action.exerciseId}"]`;
      const exercise = state.exercises.find(item => item.id === action.exerciseId);
      announce(exercise ? `${exercise.name}已${exercise.collapsed ? '折叠' : '展开'}` : '');
    } else if (action.type === 'START_WORKOUT') {
      state = Core.startWorkout(state, Date.now());
      themeMenuOpen = false;
      editingSetId = null;
      resetRestUi();
      // 页面切换：焦点移到页面标题 h2，读屏先播报页面语境，再让用户 Tab 进入操作区。
      pendingFocus = '#workout-title';
      announce('训练已开始');
    } else if (action.type === 'SELECT_SET') {
      const target = currentSet(action.setId);
      // 重复点击已选中的待训练组：无状态变化，不重建页面，保留当前焦点。
      if (target && target.status === 'pending' && action.setId === state.selectedSetId) {
        announce('该组已选中，可点击开始本组');
        return;
      }
      const next = Core.selectSet(state, action.setId);
      // 存在进行中组或目标不是待训练组时 core 返回同一引用，此时不重建页面。
      if (next === state) {
        announce('该组不可选择，请先完成或跳过当前组');
        return;
      }
      state = next;
      pendingFocus = `[data-action="SELECT_SET"][data-set-id="${action.setId}"]`;
      announce('已选择该组，可点击开始本组');
    } else if (action.type === 'START_SET') {
      const next = Core.startSelectedSet(state, Date.now());
      if (next === state) return;
      state = next;
      pendingFocus = '[data-role="main-action"]';
      announce('本组已开始');
    } else if (action.type === 'COMPLETE_SET') {
      const next = Core.completeSelectedSet(state, Date.now());
      if (next === state) return;
      state = next;
      editingSetId = null;
      resetRestUi();
      pendingFocus = '#rest-title';
      announce('本组已完成，进入组间休息');
    } else if (action.type === 'START_NEXT_SET') {
      const next = Core.startNextSet(state, Date.now());
      if (next === state) return;
      state = next;
      resetRestUi();
      pendingFocus = '#workout-title';
      announce('休息结束，开始下一组');
    } else if (action.type === 'CHOOSE_NEXT_SET') {
      const next = Core.chooseNextSet(state, action.setId, Date.now());
      if (next === state) {
        announce('该组当前不可选择');
        return;
      }
      state = next;
      resetRestUi();
      pendingFocus = '#workout-title';
      announce('已选择该组并开始训练');
    } else if (action.type === 'TOGGLE_NEXT_PANEL') {
      choosingNext = !choosingNext;
      pendingFocus = choosingNext
        ? '#rest-chooser .rest-chooser__item'
        : '[data-action="TOGGLE_NEXT_PANEL"]';
      announce(choosingNext ? '已展开其他未完成组，可直接选择开始' : '已收起选择面板');
    } else if (action.type === 'JUMP_REST_TIMER') {
      // 仅桌面演示控制：把休息起点前移到目标前 3 秒，用于验证达标反馈。
      if (state.screen !== 'rest' || state.restStartedAt == null) return;
      state = { ...state, restStartedAt: Date.now() - 87_000 };
      announce('已跳至目标前 3 秒');
    } else if (action.type === 'SKIP_SET') {
      const next = Core.skipSelectedSet(state);
      if (next === state) return;
      state = next;
      editingSetId = null;
      pendingFocus = '[data-role="main-action"]';
      announce('本组已跳过');
    } else if (action.type === 'ADD_SET') {
      if (!action.exerciseId) return;
      // 先记住已有组 id，新增后据此找到真正的新组，避免复制 core 的序号推算逻辑。
      const beforeIds = new Set(state.exercises.flatMap(item => item.sets).map(set => set.id));
      state = Core.addTemporarySet(state, action.exerciseId);
      const added = state.exercises.flatMap(item => item.sets).find(set => !beforeIds.has(set.id));
      // 焦点落到新增组所在行：用户能立刻看到并进入刚添加的组，而不是被带到列表末尾的添加按钮。
      pendingFocus = added ? `[data-set-row="${added.id}"] .workout-set__row` : '[data-action="ADD_SET"]';
      announce('已添加一组临时训练');
    } else if (action.type === 'EDIT_CURRENT') {
      const selected = currentSet(state.selectedSetId);
      if (!selected || !['pending', 'active'].includes(selected.status)) return;
      editingSetId = editingSetId === selected.id ? null : selected.id;
      pendingFocus = '[data-action="EDIT_CURRENT"]';
      announce(editingSetId ? '可修改本组实际重量与次数' : '已收起数据编辑');
    } else if (action.type === 'EDIT_SET') {
      // 唯一的规范化编辑 action：非法值直接忽略，NaN 不会进入 core。
      const value = sanitizeEditValue(action.value);
      if (value === null || !action.setId || (action.field !== 'weight' && action.field !== 'reps')) return;
      state = Core.editSet(state, action.setId, action.field === 'weight' ? { actualWeight: value } : { actualReps: value });
      announce('已记录本次调整，仅本次生效');
    } else if (action.type === 'OPEN_END_SHEET') {
      // 只打开界面覆盖，不提前改变任何训练业务状态。
      endSheetReturnFocus = action.returnFocus || '[data-role="end-trigger"]';
      uiState.endSheetOpen = true;
      uiState.discardDialogOpen = false;
      pendingFocus = '#end-sheet-title';
      announce('已打开结束训练确认');
    } else if (action.type === 'CLOSE_END_SHEET') {
      uiState.endSheetOpen = false;
      uiState.discardDialogOpen = false;
      pendingFocus = endSheetReturnFocus;
      announce('继续训练');
    } else if (action.type === 'SAVE_PARTIAL') {
      // 二次确认打开时底层保存不可达：即便脚本直接派发也不能把「放弃」偷换成「保存」。
      if (uiState.discardDialogOpen) return;
      // 零完成组不应有任何副作用，即使被外部调用也保持原状态。
      if (!Core.canSaveWorkout(state)) {
        announce('至少完成一组后才能保存训练');
        return;
      }
      state = Core.finishWorkout(state, Date.now());
      editingSetId = null;
      resetRestUi();
      pendingFocus = '#summary-title';
      announce('已保存本次训练，进入总结');
    } else if (action.type === 'OPEN_DISCARD_CONFIRM') {
      uiState.discardDialogOpen = true;
      pendingFocus = '[data-role="discard-cancel"]';
      announce('请确认是否放弃本次训练');
    } else if (action.type === 'CLOSE_DISCARD_CONFIRM') {
      uiState.discardDialogOpen = false;
      pendingFocus = '[data-action="OPEN_DISCARD_CONFIRM"]';
      announce('已返回结束训练确认');
    } else if (action.type === 'CONFIRM_DISCARD') {
      state = Core.discardWorkout(state);
      themeMenuOpen = false;
      editingSetId = null;
      resetRestUi();
      uiState.completedSummaryOpen = false;
      pendingFocus = '#today-title';
      announce('已放弃本次训练');
    } else if (action.type === 'SET_NOTES') {
      // 备注走局部更新：只回写状态与字数，不整页重建，避免输入过程中丢焦点。
      state = Core.setNotes(state, action.notes);
      const counter = screenRoot.querySelector('[data-role="notes-count"]');
      if (counter) counter.textContent = `${state.notes.length} / 300`;
      return;
    } else if (action.type === 'COMPLETE_SESSION') {
      const next = Core.completeSession(state);
      if (next === state) return;
      state = next;
      uiState.completedSummaryOpen = false;
      pendingFocus = '#today-title';
      announce('训练已完成，已记为今日完成');
    } else if (action.type === 'TOGGLE_SUMMARY_VIEW') {
      uiState.completedSummaryOpen = !uiState.completedSummaryOpen;
      pendingFocus = '[data-action="TOGGLE_SUMMARY_VIEW"]';
      announce(uiState.completedSummaryOpen ? '已展开本次训练总结' : '已收起本次训练总结');
    } else if (action.type === 'RESET_DEMO') {
      state = { ...Core.createInitialState(Date.now()), theme: state.theme };
      themeMenuOpen = false;
      editingSetId = null;
      resetRestUi();
      uiState.completedSummaryOpen = false;
      announce('已重置演示数据');
    }
    render();
  }

  document.addEventListener('click', event => {
    const choice = event.target.closest('[data-theme-choice]');
    if (choice) {
      // 桌面演示栏按钮与移动端弹层按钮共用同一 action：区分来源以决定关闭后的焦点落点。
      dispatch({
        type: 'SET_THEME',
        theme: choice.getAttribute('data-theme-choice'),
        fromMenu: !!choice.closest('#theme-menu')
      });
      return;
    }
    const action = event.target.closest('[data-action]');
    if (action) {
      const type = action.getAttribute('data-action');
      const exerciseId = action.getAttribute('data-exercise-id');
      const setId = action.getAttribute('data-set-id');
      dispatch({
        type,
        ...(type === 'OPEN_END_SHEET' ? { returnFocus: endTriggerSelector(action) } : {}),
        ...(exerciseId ? { exerciseId } : {}),
        ...(setId ? { setId } : {})
      });
      return;
    }
    const ui = event.target.closest('[data-ui]');
    if (ui && ui.getAttribute('data-ui') === 'toggle-theme-menu') {
      themeMenuOpen = !themeMenuOpen;
      pendingFocus = themeMenuOpen ? 'theme-option' : 'theme-trigger';
      render();
      return;
    }
    if (themeMenuOpen) {
      themeMenuOpen = false;
      render();
    }
  });

  document.addEventListener('change', event => {
    const input = event.target.closest('[data-field][data-set-id]');
    if (input) commitSetEdit(input);
  });

  // 备注输入逐字回写状态，但只做局部同步，不触发整页重建。
  document.addEventListener('input', event => {
    const notes = event.target.closest('[data-role="notes"]');
    if (notes) dispatch({ type: 'SET_NOTES', notes: notes.value });
  });

  const FOCUSABLE_SELECTOR = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  // 通用 Tab 焦点陷阱：把焦点困在给定容器内双向回绕。
  // - 容器不存在或无可见 focusable 时安全返回，不劫持 Tab；
  // - 焦点已逃出容器（activeElement 不在列表）时，下一个 Tab 拉回容器首/末。
  function trapTabWithin(containerSelector, event) {
    const scope = screenRoot.querySelector(containerSelector);
    if (!scope) return;
    const focusables = Array.from(scope.querySelectorAll(FOCUSABLE_SELECTOR))
      .filter(el => !el.hidden && el.getClientRects().length > 0);
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    const index = focusables.indexOf(document.activeElement);
    if (event.shiftKey) {
      if (index <= 0) {
        event.preventDefault();
        last.focus();
      }
    } else if (index === -1 || index === focusables.length - 1) {
      event.preventDefault();
      first.focus();
    }
  }

  document.addEventListener('keydown', event => {
    // Escape 顶层规则：有二次确认先关确认，其次关 Sheet，最后才关主题菜单。
    if (event.key === 'Escape') {
      if (uiState.discardDialogOpen) {
        dispatch({ type: 'CLOSE_DISCARD_CONFIRM' });
        return;
      }
      if (uiState.endSheetOpen) {
        dispatch({ type: 'CLOSE_END_SHEET' });
        return;
      }
      if (themeMenuOpen) {
        themeMenuOpen = false;
        pendingFocus = 'theme-trigger';
        render();
        return;
      }
    }
    // 焦点陷阱：Tab/Shift+Tab 必须困在最上层覆盖层内（二次确认优先于结束 Sheet），
    // 背景已 inert，所以这里只需要处理覆盖层内部的回绕与「焦点逃出容器」两种情况。
    // 容器内没有任何可聚焦元素时安全返回，不抛错也不劫持 Tab。
    if (event.key === 'Tab') {
      if (uiState.discardDialogOpen) {
        trapTabWithin('#discard-dialog', event);
      } else if (uiState.endSheetOpen) {
        trapTabWithin('#end-sheet', event);
      }
    }
    // 回车提交当前编辑，与失焦提交走同一条安全路径。
    if (event.key === 'Enter') {
      const input = event.target.closest('[data-field][data-set-id]');
      if (input) {
        event.preventDefault();
        commitSetEdit(input);
      }
    }
  });

  // 休息页局部刷新：更新环形几何、aria-label、累计/剩余/超时文本，并只播报一次达标反馈。
  // 全程只改属性与文本，不重建页面、不重播动画。
  function updateRestRegions(timers) {
    const ring = screenRoot.querySelector('[data-role="rest-ring"]');
    if (!ring) return;
    const reached = restReached(timers);
    ring.setAttribute('data-state', reached ? 'reached' : 'pending');
    ring.setAttribute('aria-label', buildRestRingLabel(timers));
    const progress = ring.querySelector('[data-role="rest-ring-progress"]');
    if (progress) progress.setAttribute('stroke-dashoffset', restRingOffset(timers).toFixed(2));
    const timer = ring.querySelector('[data-role="rest-timer"]');
    if (timer) timer.textContent = Core.formatDuration(timers.restSeconds);
    const status = screenRoot.querySelector('[data-role="rest-state"]');
    if (status) status.textContent = restStatusText(timers);
    if (reached && !restTargetAnnounced) {
      restTargetAnnounced = true;
      ring.classList.add('rest-ring--celebrate');
      announce('已达到目标休息时间');
    }
  }

  // 250ms 界面刷新：只在执行/休息阶段更新计时文本与轨道，不重建页面、不动输入焦点。
  // 全局仅注册一次，节点在 render 后重新生成，找不到就跳过。
  function refreshLiveRegions() {
    if (!['active', 'resting'].includes(state.sessionStatus)) return;
    const timers = Core.deriveTimers(state, Date.now());
    const workoutTimer = screenRoot.querySelector('[data-role="workout-timer"]');
    if (workoutTimer) workoutTimer.textContent = Core.formatDuration(timers.workoutSeconds);
    const setTimer = screenRoot.querySelector('[data-role="set-timer"]');
    if (setTimer) setTimer.textContent = Core.formatDuration(timers.setSeconds);
    if (state.screen === 'rest') updateRestRegions(timers);
    const track = screenRoot.querySelector('[data-role="rhythm-track"]');
    if (track) track.setAttribute('aria-label', buildTrackLabel(Core.getWorkoutStats(state)));
  }

  setInterval(refreshLiveRegions, 250);

  window.FitnessPrototype = {
    getState: () => state,
    dispatch,
    render
  };

  render();
})();
  </script>
</body>
</html>
