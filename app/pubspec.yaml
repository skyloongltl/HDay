name: fitness_counter

description: Android-first fitness planning and workout tracking app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  sqflite: ^2.4.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
          weight: 100
        - asset: assets/fonts/NotoSansSC-VF.ttf
          weight: 200
        - asset: assets/fonts/NotoSansSC-VF.ttf
          weight: 300
        - asset: assets/fonts/NotoSansSC-VF.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-VF.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-VF.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC-VF.ttf
          weight: 700
        - asset: assets/fonts/NotoSansSC-VF.ttf
          weight: 800
        - asset: assets/fonts/NotoSansSC-VF.ttf
          weight: 900
  assets:
    - assets/themes/theme-package.schema.json
    - assets/themes/breath-rhythm/manifest.json
